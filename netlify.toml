[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# Rappels J-1 / J-0 aux organisateur·rices de distributions — 9h UTC chaque jour
[functions."cron-distribution-reminders"]
  schedule = "0 9 * * *"

# SPA fallback (toutes les routes React Router pointent vers index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sécurité — en-têtes par défaut
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
