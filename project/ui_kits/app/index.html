<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenant! — UI Kit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F9FAFB;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    /* Responsive: show/hide desktop vs mobile nav */
    @media (min-width: 768px) {
      .mobile-menu-btn { display: none !important; }
      .bottom-nav { display: none !important; }
      .desktop-footer { display: block !important; }
    }
    @media (max-width: 767px) {
      .desktop-nav { display: none !important; }
      .mobile-menu-btn { display: flex !important; }
      .bottom-nav { display: flex !important; }
      .desktop-footer { display: none !important; }
    }
    /* Tweaks panel */
    #tweaks-panel {
      position: fixed; bottom: 80px; right: 16px; z-index: 9999;
      background: #fff; border: 1px solid #E5E7EB; border-radius: 16px;
      padding: 16px; width: 220px; box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      display: none; flex-direction: column; gap: 12px;
    }
    #tweaks-panel.open { display: flex; }
    .tweak-label { font-size: 11px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .tweak-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .tweak-btn { padding: 4px 10px; border-radius: 9999px; border: 1.5px solid #E5E7EB; background: #fff; font-size: 11px; font-weight: 600; cursor: pointer; color: #374151; }
    .tweak-btn.active { background: linear-gradient(to right,#C1121F,#F4721E); color: #fff; border-color: transparent; }
  </style>
</head>
<body>

<div id="root"></div>

<!-- Load components -->
<script type="text/babel" src="Layout.jsx"></script>
<script type="text/babel" src="PetitionCard.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="ServicesPage.jsx"></script>

<!-- Main App -->
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startPage": "home",
  "viewport": "desktop"
}/*EDITMODE-END*/;

function App() {
  const [activePage, setActivePage] = React.useState(
    () => localStorage.getItem('mn_page') || TWEAK_DEFAULTS.startPage
  );
  const [currentUser, setCurrentUser] = React.useState(null);
  const [tweakOpen, setTweakOpen] = React.useState(false);
  const [tweak, setTweak] = React.useState(TWEAK_DEFAULTS);

  // Persist page
  React.useEffect(() => { localStorage.setItem('mn_page', activePage); }, [activePage]);

  // Init lucide icons after each render
  React.useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  // Tweaks panel messaging
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweakOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleLogin = (user) => { setCurrentUser(user); setActivePage('home'); };

  const renderPage = () => {
    switch(activePage) {
      case 'home':          return <MHomePage setActivePage={setActivePage} />;
      case 'services':      return <MServicesPage setActivePage={setActivePage} />;
      case 'creer':         return <MCreerPage setActivePage={setActivePage} />;
      case 'reseau':        return <MReseauPage setActivePage={setActivePage} />;
      case 'login':         return <MLoginPage onLogin={handleLogin} setActivePage={setActivePage} />;
      case 'mobilizations': return <PlaceholderPage icon="📅" title="Mobilisations" sub="Calendrier des mobilisations citoyennes." setActivePage={setActivePage} />;
      case 'crowdfunding':  return <PlaceholderPage icon="💰" title="Cagnottes" sub="Solidaires · Luttes · Participatif · Grandes Caisses" setActivePage={setActivePage} />;
      case 'join':          return <PlaceholderPage icon="❤️" title="Adhérer" sub="Rejoindre le mouvement THE99COINPROJECT." setActivePage={setActivePage} />;
      case 'media':         return <PlaceholderPage icon="📰" title="Média" sub="Articles et analyses militantes." setActivePage={setActivePage} />;
      case 'profile':       return <PlaceholderPage icon="👤" title="Mon Profil" sub="Gérer votre profil militant." setActivePage={setActivePage} />;
      case 'notifications': return <PlaceholderPage icon="🔔" title="Notifications" sub="Vos alertes et messages." setActivePage={setActivePage} />;
      default:              return <MHomePage setActivePage={setActivePage} />;
    }
  };

  const hideLayout = ['login','creer'].includes(activePage);

  if (hideLayout) return (
    <div>
      {renderPage()}
    </div>
  );

  return (
    <div>
      <MHeader activePage={activePage} setActivePage={setActivePage} currentUser={currentUser} />
      <main style={{ paddingBottom: 72 }} className="main-content">
        {renderPage()}
      </main>
      <MFooter />
      <MBottomNav activePage={activePage} setActivePage={setActivePage} />

      {/* Tweaks Panel */}
      <div id="tweaks-panel" className={tweakOpen ? 'open' : ''}>
        <div style={{ fontFamily: "'Sora',sans-serif", fontWeight: 700, fontSize: 13, color: '#111827', borderBottom: '1px solid #F3F4F6', paddingBottom: 8, marginBottom: 4 }}>Tweaks</div>
        <div>
          <div className="tweak-label">Page de démarrage</div>
          <div className="tweak-row">
            {['home','services','creer','reseau','login'].map(p => (
              <button key={p} className={`tweak-btn${tweak.startPage === p ? ' active' : ''}`}
                onClick={() => {
                  const next = {...tweak, startPage: p};
                  setTweak(next); setActivePage(p);
                  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
                }}>{p}</button>
            ))}
          </div>
        </div>
        <div>
          <div className="tweak-label">Utilisateur</div>
          <div className="tweak-row">
            <button className={`tweak-btn${!currentUser ? ' active' : ''}`} onClick={() => setCurrentUser(null)}>Non connecté</button>
            <button className={`tweak-btn${currentUser ? ' active' : ''}`} onClick={() => setCurrentUser({ name: 'Marie D.', email: 'marie@test.fr' })}>Connecté</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PlaceholderPage({ icon, title, sub, setActivePage }) {
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  return (
    <div style={{ minHeight: '80vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 32, textAlign: 'center' }}>
      <div style={{ fontSize: 52, marginBottom: 14 }}>{icon}</div>
      <h2 style={{ fontFamily: "'Sora',sans-serif", fontSize: 24, fontWeight: 800, color: '#111827', margin: '0 0 8px', letterSpacing: '-0.02em' }}>{title}</h2>
      <p style={{ color: '#6B7280', fontSize: 14, maxWidth: 320, lineHeight: 1.6, margin: '0 0 24px' }}>{sub}</p>
      <button onClick={() => setActivePage('home')} style={{ background: 'linear-gradient(to right,#C1121F,#F4721E)', color: '#fff', fontWeight: 700, fontSize: 13, height: 40, padding: '0 20px', borderRadius: 9999, border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}>
        <i data-lucide="arrow-left" style={{width:15,height:15}}></i> Retour à l'accueil
      </button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
