<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E11D74">
  <meta name="description" content="Maintenant! — Plateforme de mobilisation citoyenne et services solidaires. La voix des 99%.">
  <meta property="og:title" content="Maintenant ! — La voix des 99%">
  <meta property="og:description" content="Pétitions · Mobilisations · Hébergement · Covoiturage · Marketplace · SEL">
  <meta property="og:image" content="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200&q=80">
  <title>Maintenant ! — La voix des 99%</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAFAF9;
      color: #1A1A18;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      line-height: 1.5;
    }

    img { max-width: 100%; height: auto; display: block; }
    input, select, textarea, button { font-family: inherit; }
    input, select, textarea { font-size: 16px !important; -webkit-appearance: none; border-radius: 0; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }

    /* ── Scrollbar ───────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #F5F4F2; }
    ::-webkit-scrollbar-thumb { background: #D4D1CA; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #B0AEA7; }

    /* ── Responsive breakpoints ─────────────────────────── */
    /* Mobile first ≤ 767px (téléphone portrait & paysage)  */
    /* Tablette portrait & paysage : 768 → 1023            */
    /* Desktop : ≥ 1024                                     */

    /* —— Globals dynamiques ——————————————————————————— */
    /* Fluid container : padding latéral qui s'adapte */
    .mn-container { padding-left: clamp(16px, 4vw, 48px); padding-right: clamp(16px, 4vw, 48px); }
    /* Conteneurs scrollables horizontalement (pour tableaux/longs filtres) */
    .mn-hscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .mn-hscroll::-webkit-scrollbar { height: 3px; }
    /* Tableaux qui se transforment en scroll horizontal sur mobile */
    .mn-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
    .mn-table-wrap table { min-width: 640px; }
    /* Empêche les images SVG/photos d'être plus larges que leur conteneur */
    svg { max-width: 100%; }
    /* Tap targets ≥ 44px sur mobile */
    button, [role="button"], a { min-height: auto; }

    /* ===== Mobile (< 768px) ============================= */
    @media (max-width: 767px) {
      .mn-desk { display: none !important; }
      .mn-mob-btn { display: flex !important; }
      .mn-bot { display: flex !important; }
      .mn-media-featured { grid-template-columns: 1fr !important; }
      .mn-detail-grid { grid-template-columns: 1fr !important; }
      .mn-reseau-grid { grid-template-columns: 1fr !important; }
      .mn-reseau-sidebar { display: none !important; }
      .mn-messaging-grid { grid-template-columns: 1fr !important; min-height: auto !important; }
      /* Footer mobile : seul le strip bottom (copyright + mentions + wallet) reste visible */
      .mn-footer-top { display: none !important; }
      .mn-footer-strip { padding: 12px 16px !important; flex-direction: column !important; align-items: center !important; text-align: center !important; gap: 8px !important; font-size: 11px !important; }

      /* Toute grille à 2-3-4-5 colonnes → 1 colonne */
      [data-mn-grid="2"], [data-mn-grid="3"], [data-mn-grid="4"], [data-mn-grid="auto"] {
        grid-template-columns: 1fr !important;
      }
      /* Sauf les hubs / cartes service qui font 2 colonnes serrées */
      [data-mn-grid="services"] { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }

      /* Hero / titres : tailles réduites */
      [data-mn-hero] h1, [data-mn-hero] .display { font-size: clamp(28px, 8vw, 38px) !important; line-height: 1.1 !important; }
      [data-mn-hero] { padding: 24px 0 !important; }

      /* Cards / Containers : padding réduit */
      [data-mn-card] { padding: 16px !important; }
      [data-mn-section] { padding: 32px 0 !important; }

      /* Stack : tout ce qui est en flex-row → flex-col */
      [data-mn-stack-mob] { flex-direction: column !important; align-items: stretch !important; }
      [data-mn-stack-mob] > * { width: 100% !important; }

      /* Tableaux internes auto-scroll */
      table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }

      /* Body : laisse l'espace pour la nav du bas */
      body { padding-bottom: 64px; }

      /* Tweaks panel + assistant flottants : plus haut quand bot nav active */
      #tweaks-panel { bottom: 80px !important; right: 8px !important; left: 8px !important; width: auto !important; }

      /* Filtres/chips : scrollables horizontalement sans wrap */
      [data-mn-chips] { flex-wrap: nowrap !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
      [data-mn-chips] > * { flex-shrink: 0; }

      /* Modaux : full-screen sur mobile */
      [data-mn-modal] {
        max-width: 100vw !important;
        max-height: 100vh !important;
        height: 100vh !important;
        border-radius: 0 !important;
        margin: 0 !important;
      }
    }

    /* ===== Tablette (768 → 1023) ======================== */
    @media (min-width: 768px) and (max-width: 1023px) {
      .mn-desk { display: flex !important; }
      .mn-mob-btn { display: none !important; }
      .mn-bot { display: none !important; }
      .mn-footer { display: block !important; }
      .mn-mob-nav-panel { display: none !important; }

      /* Compactage de la nav (icônes + labels courts) */
      [data-mn-nav-label] { font-size: 12px !important; }
      [data-mn-nav-link] { padding: 8px 10px !important; }

      /* Réseau garde sa sidebar mais plus étroite */
      .mn-reseau-grid { grid-template-columns: minmax(0,1fr) 240px !important; gap: 16px !important; }

      /* Grilles 4 → 2-3 colonnes */
      [data-mn-grid="4"] { grid-template-columns: repeat(2, 1fr) !important; }
      [data-mn-grid="3"] { grid-template-columns: repeat(2, 1fr) !important; }

      /* Hero plus petit */
      [data-mn-hero] h1, [data-mn-hero] .display { font-size: clamp(36px, 5vw, 56px) !important; }
    }

    /* ===== Desktop (≥ 1024px) =========================== */
    @media (min-width: 1024px) {
      .mn-desk { display: flex !important; }
      .mn-mob-btn { display: none !important; }
      .mn-bot { display: none !important; }
      .mn-footer { display: block !important; }
      .mn-mob-nav-panel { display: none !important; }
    }

    /* ===== Très petits mobiles (< 380px) ================ */
    @media (max-width: 379px) {
      [data-mn-grid="services"] { grid-template-columns: 1fr !important; }
      [data-mn-hero] h1, [data-mn-hero] .display { font-size: 26px !important; }
      [data-mn-card] { padding: 12px !important; }
    }

    /* ===== Polish responsive supplémentaire ============== */
    @media (max-width: 767px) {
      /* SectionTitle (titre + bouton action) — empile sur mobile */
      .mn-section-title { flex-direction: column !important; align-items: stretch !important; }
      .mn-section-title > * { width: 100% !important; }

      /* PageContainer — réduit le padding latéral */
      [data-mn-page] { padding: 18px 14px 90px !important; }

      /* Toast — pleine largeur en bas */
      .mn-toast-wrap { left: 12px !important; right: 12px !important; transform: none !important; max-width: none !important; }

      /* Profile cover : moins haute */
      .mn-profile-cover { height: 130px !important; }
      /* Profile header : repli vertical */
      .mn-profile-header { flex-direction: column !important; align-items: stretch !important; gap: 16px !important; }

      /* Wallet/CTA dark sections : grid auto → 1 colonne */
      .mn-wallet-card { grid-template-columns: 1fr !important; gap: 14px !important; }

      /* Buttons groupés : full width côte à côte si flex */
      .mn-btn-row { flex-direction: column !important; }
      .mn-btn-row > * { width: 100% !important; }

      /* Cards mobilisations : cache la photo en dessous de 480px (priorité au texte) */
      .mn-mob-card-img { display: none !important; }

      /* Bandeau newsletter Home : stack vertical en mobile */
      .mn-newsletter { grid-template-columns: 1fr !important; gap: 16px !important; padding: 24px !important; }
      .mn-newsletter form { min-width: 0 !important; flex-direction: column !important; }
      .mn-newsletter form > * { width: 100% !important; }
    }

    /* Tablette portrait spécifique */
    @media (min-width: 600px) and (max-width: 850px) {
      /* AppNav très compact */
      [data-mn-nav-label] { font-size: 11px !important; }
    }

    /* Très petits écrans (galaxy fold etc.) */
    @media (max-width: 340px) {
      h1 { font-size: 22px !important; }
      h2 { font-size: 18px !important; }
      [data-mn-hero] { padding: 16px 0 !important; }
    }

    /* ===== Mobile paysage (≤ 950px && hauteur ≤ 500) === */
    @media (max-height: 500px) and (orientation: landscape) {
      [data-mn-hero] { padding: 18px 0 !important; }
      [data-mn-hero] h1, [data-mn-hero] .display { font-size: 28px !important; }
    }

    /* ── Page transition ────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-enter { animation: fadeUp 0.24s cubic-bezier(0.4, 0, 0.2, 1) both; }

    /* ── Card hover (CSS, pas JS — fonctionne sur tactile aussi) ── */
    .mn-card-hover { will-change: transform, box-shadow; }
    .mn-card-hover:hover { box-shadow: 0 12px 36px rgba(0,0,0,0.08); transform: translateY(-3px); border-color: rgba(225,29,116,0.2); }
    .mn-card-hover:focus-visible { outline: 2px solid #E11D74; outline-offset: 2px; }

    /* ── FAB pétition mobile (au-dessus de la BottomNav 64px) ── */
    .mn-petition-fab { display: none; }
    @media (max-width: 767px) {
      .mn-petition-fab { display: block; position: fixed; bottom: 80px; left: 16px; right: 16px; z-index: 50; box-shadow: 0 10px 32px rgba(0,0,0,0.18); border-radius: 14px; }
    }

    /* ── Tweaks panel ───────────────────────────────────── */
    #tweaks-panel {
      position: fixed; bottom: 80px; right: 16px; z-index: 9000;
      background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 16px;
      padding: 16px; width: 250px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06);
      display: none; flex-direction: column; gap: 12px;
    }
    #tweaks-panel.open { display: flex; }
    .tw-head { font-family: 'Sora',sans-serif; font-weight: 800; font-size: 13px; color: #1A1A18; border-bottom: 1px solid #F5F4F2; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .tw-label { font-size: 10px; font-weight: 700; color: #B0AEA7; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .tw-row { display: flex; gap: 5px; flex-wrap: wrap; }
    .tw-btn { padding: 5px 10px; border-radius: 9999px; border: 1.5px solid #E8E6E1; background: #fff; font-size: 11px; font-weight: 600; cursor: pointer; color: #4A4840; font-family: 'Inter',sans-serif; transition: all 0.15s; }
    .tw-btn:hover { border-color: #E11D74; color: #E11D74; }
    .tw-btn.active { background: linear-gradient(to right, #E11D74, #7C3AED); color: #fff; border-color: transparent; }

    /* ── Utility ─────────────────────────────────────────── */
    .mn-reseau-grid { display: grid; grid-template-columns: minmax(0,1fr) 290px; gap: 24px; align-items: start; }
    .mn-messaging-grid { display: grid; grid-template-columns: 300px 1fr; min-height: 520px; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Core data -->
<script type="text/babel" src="AppData.jsx"></script>

<!-- Design system -->
<script type="text/babel" src="Theme.jsx"></script>

<!-- Compatibility shims (old UIKit → new Theme aliases) -->
<script type="text/babel" src="Compat.jsx"></script>

<!-- Pages -->
<script type="text/babel" src="Pages_Home.jsx"></script>
<script type="text/babel" src="Pages_Services.jsx"></script>
<script type="text/babel" src="Pages_Commerce.jsx"></script>
<script type="text/babel" src="Pages_Media_Profile.jsx"></script>
<script type="text/babel" src="CampaignPage.jsx"></script>
<script type="text/babel" src="ReseauPage.jsx"></script>
<script type="text/babel" src="PollsPage.jsx"></script>
<script type="text/babel" src="AdminMessagingNotifs.jsx"></script>
<script type="text/babel" src="AdminEmailsAPI.jsx"></script>
<script type="text/babel" src="JoinMovement.jsx"></script>
<script type="text/babel" src="CommunesLibres.jsx"></script>
<script type="text/babel" src="LegalPages.jsx"></script>

<script type="text/babel">
// Re-import globals from window (Babel scripts run in isolated scope)
const T      = window.T;
const ICONS  = window.ICONS;

// ── Tweak defaults ─────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "startPage": "home",
  "adminMode": false
}/*EDITMODE-END*/;

// ── Root App ───────────────────────────────────────────────
function App() {
  const [page, setPageRaw] = React.useState(() => {
    try { return localStorage.getItem('mn_v2_page') || TWEAK_DEFAULTS.startPage; } catch { return TWEAK_DEFAULTS.startPage; }
  });
  const [user, setUser] = React.useState(() => {
    try { const u = localStorage.getItem('mn_v2_user'); return u ? JSON.parse(u) : null; } catch { return null; }
  });
  const [adminMode, setAdminMode] = React.useState(TWEAK_DEFAULTS.adminMode);
  const [authOpen, setAuthOpen]   = React.useState(false);
  const [tweakOpen, setTweakOpen] = React.useState(false);
  const [tweak, setTweak]         = React.useState(TWEAK_DEFAULTS);

  // Persist page & user
  React.useEffect(() => { try { localStorage.setItem('mn_v2_page', page); } catch {} }, [page]);
  React.useEffect(() => { try { if (user) localStorage.setItem('mn_v2_user', JSON.stringify(user)); else localStorage.removeItem('mn_v2_user'); } catch {} }, [user]);

  // Tweaks protocol
  React.useEffect(() => {
    const h = e => {
      if (e.data?.type === '__activate_edit_mode')   setTweakOpen(true);
      if (e.data?.type === '__deactivate_edit_mode')  setTweakOpen(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  const setPage = p => { setPageRaw(p); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const handleLogin  = u => { setUser(u); setAuthOpen(false); };
  const handleLogout = () => { setUser(null); try { localStorage.removeItem('mn_v2_user'); } catch {} setPage('home'); };

  const common = { user, setUser, adminMode, onAuth: () => setAuthOpen(true), setPage };
  const noNav  = ['creer'].includes(page);

  const renderPage = () => {
    switch (page) {
      case 'home':          return <div className="page-enter"><HomePage setPage={setPage} user={user} onAuth={() => setAuthOpen(true)} /></div>;
      case 'petitions':     return <div className="page-enter"><PetitionsPage {...common} /></div>;
      case 'mobilizations': return <div className="page-enter"><MobilizationsPage {...common} /></div>;
      case 'crowdfunding':  return <div className="page-enter"><CrowdfundingPage {...common} /></div>;
      case 'housing':       return <div className="page-enter"><HousingPage {...common} /></div>;
      case 'carpooling':    return <div className="page-enter"><CarpoolingPage {...common} /></div>;
      case 'lending':       return <div className="page-enter"><LendingPage {...common} /></div>;
      case 'marketplace':   return <div className="page-enter"><MarketplacePage {...common} /></div>;
      case 'media':         return <div className="page-enter"><MediaPage adminMode={adminMode} onAuth={() => setAuthOpen(true)} /></div>;
      case 'garden':        return <div className="page-enter"><GardenPage {...common} /></div>;
      case 'sel':           return <div className="page-enter"><SELPage {...common} /></div>;
      case 'services':      return <div className="page-enter"><ServicesHub setPage={setPage} user={user} onAuth={() => setAuthOpen(true)} /></div>;
      case 'creer':         return <div className="page-enter"><CreerPage setPage={setPage} user={user} onAuth={() => setAuthOpen(true)} /></div>;
      case 'campaigns':     return <div className="page-enter"><CampaignsPage {...common} /></div>;
      case 'reseau':        return <div className="page-enter"><ReseauPage user={user} onOpenAuth={() => setAuthOpen(true)} setActivePage={setPage} adminMode={adminMode} /></div>;
      case 'polls':         return <div className="page-enter"><PollsPage user={user} setUser={setUser} onAuth={() => setAuthOpen(true)} setPage={setPage} /></div>;
      case 'messaging':     return <div className="page-enter"><MessagingPage user={user} onOpenAuth={() => setAuthOpen(true)} /></div>;
      case 'notifications': return <div className="page-enter"><NotificationsPage user={user} onOpenAuth={() => setAuthOpen(true)} /></div>;
      case 'admin':         return <div className="page-enter"><AdminDashboard user={user} setActivePage={setPage} /></div>;
      case 'join':          return <div className="page-enter"><JoinMovementPage user={user} setUser={setUser} onAuth={() => setAuthOpen(true)} setPage={setPage} /></div>;
      case 'communes':      return <div className="page-enter"><CommunesLibresPage user={user} onAuth={() => setAuthOpen(true)} setPage={setPage} /></div>;
      case 'profile':       return <div className="page-enter"><ProfilePage user={user} setUser={setUser} onAuth={() => setAuthOpen(true)} setPage={setPage} /></div>;
      case 'legal':         return <div className="page-enter"><LegalPage /></div>;
      case 'cgu':           return <div className="page-enter"><CguPage /></div>;
      case 'rgpd':          return <div className="page-enter"><RgpdPage /></div>;
      case 'contact':       return <div className="page-enter"><ContactPage setPage={setPage} /></div>;
      default:              return <div className="page-enter"><HomePage setPage={setPage} user={user} onAuth={() => setAuthOpen(true)} /></div>;
    }
  };

  return (
    <div style={{ minHeight: '100vh', background: T.bg }}>
      {/* Navigation */}
      {!noNav && (
        <AppNav
          page={page} setPage={setPage}
          user={user} onAuth={() => setAuthOpen(true)} onLogout={handleLogout}
          adminMode={adminMode} setAdminMode={setAdminMode}
        />
      )}

      {/* Main */}
      <main style={{ paddingBottom: noNav ? 0 : 80 }}>
        {renderPage()}
      </main>

      {/* Footer */}
      {!noNav && (
        <footer className="mn-footer" style={{ background: T.surface, borderTop: `1px solid ${T.border}` }}>
          {/* Top section : 4 colonnes — desktop/tablette uniquement */}
          <div className="mn-footer-top" style={{ maxWidth: 1280, margin: '0 auto', padding: '40px 24px 24px', display: 'grid', gridTemplateColumns: 'minmax(220px,1.4fr) repeat(3, 1fr)', gap: 32 }}>
            {/* Brand */}
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
                <div style={{ width: 36, height: 36, borderRadius: 10, background: T.gradR, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 3px 10px rgba(225,29,116,0.25)' }}>
                  <span style={{ color: '#fff', fontFamily: "'Sora',sans-serif", fontWeight: 800, fontSize: 14 }}>M!</span>
                </div>
                <div>
                  <div style={{ fontFamily: "'Sora',sans-serif", fontWeight: 800, fontSize: 16, color: T.brand, lineHeight: 1.1 }}>Maintenant !</div>
                  <div style={{ fontSize: 10, color: T.text4, textTransform: 'uppercase', letterSpacing: '0.08em' }}>La voix des 99%</div>
                </div>
              </div>
              <p style={{ fontSize: 13, color: T.text3, lineHeight: 1.6, margin: 0, maxWidth: 320 }}>
                Plateforme citoyenne et solidaire pour mobiliser, s'informer, échanger, partager, s'organiser, agir.
              </p>
            </div>

            {/* Plateforme */}
            <div>
              <h4 style={{ fontFamily: "'Sora',sans-serif", fontSize: 12, fontWeight: 700, color: T.text2, textTransform: 'uppercase', letterSpacing: '0.08em', margin: '0 0 14px' }}>Plateforme</h4>
              <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: 9 }}>
                {[['Services solidaires', 'services'], ['Campagnes', 'campaigns'], ['Réseau', 'reseau'], ['Média', 'media'], ['Adhérer au mouvement', 'join']].map(([l, p]) => (
                  <li key={p}>
                    <a href={`#${p}`} onClick={e => { e.preventDefault(); setPage(p); }} style={{ cursor: 'pointer', transition: 'color 0.15s', textDecoration: 'none', color: T.text3, fontSize: 13 }}
                      onMouseEnter={e => e.currentTarget.style.color = T.brand} onMouseLeave={e => e.currentTarget.style.color = T.text3}>{l}</a>
                  </li>
                ))}
              </ul>
            </div>

            {/* Suivre */}
            <div>
              <h4 style={{ fontFamily: "'Sora',sans-serif", fontSize: 12, fontWeight: 700, color: T.text2, textTransform: 'uppercase', letterSpacing: '0.08em', margin: '0 0 14px' }}>Nous suivre</h4>
              <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                {[
                  { name: 'Instagram', url: 'https://instagram.com/maintenant_lemouvement', svg: <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg> },
                  { name: 'Mastodon', url: 'https://mastodon.social/@maintenant', svg: <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.58 13.913c-.29 1.469-2.592 3.121-5.238 3.396-1.379.165-2.737.32-4.185.255-2.368-.108-4.235-.567-4.235-.567 0 .234.014.456.043.665.307 2.348 2.319 2.488 4.226 2.554 1.925.066 3.64-.475 3.64-.475l.079 1.745s-1.347.724-3.749.857c-1.323.073-2.967-.034-4.881-.541-4.151-1.099-4.866-5.524-4.975-10.012-.034-1.334-.013-2.591-.013-3.643 0-4.589 3.005-5.935 3.005-5.935 1.515-.696 4.114-.989 6.815-1.011h.066c2.701.022 5.302.315 6.817 1.011 0 0 3.005 1.346 3.005 5.935 0 0 .038 3.388-.42 5.766zm-3.193-5.39v5.252h-2.083V8.677c0-1.083-.456-1.633-1.366-1.633-1.007 0-1.512.652-1.512 1.94v2.81H11.36V8.984c0-1.288-.505-1.94-1.512-1.94-.91 0-1.366.55-1.366 1.633v5.098H6.4V8.523c0-1.082.276-1.943.829-2.581.57-.638 1.317-.965 2.245-.965 1.073 0 1.886.413 2.43 1.238l.518.872.519-.872c.544-.825 1.357-1.238 2.43-1.238.928 0 1.675.327 2.245.965.553.638.829 1.499.829 2.581z"/></svg> },
                  { name: 'X (Twitter)', url: 'https://x.com/maintenant_mvt', svg: <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg> },
                  { name: 'YouTube', url: 'https://youtube.com/@maintenant', svg: <svg width="18" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg> },
                ].map(s => (
                  <a key={s.name} href={s.url} target="_blank" rel="noopener noreferrer" aria-label={s.name}
                    style={{ width: 36, height: 36, borderRadius: 10, background: T.surface2, display: 'flex', alignItems: 'center', justifyContent: 'center', color: T.text3, transition: 'all 0.15s', textDecoration: 'none' }}
                    onMouseEnter={e => { e.currentTarget.style.background = T.gradR; e.currentTarget.style.color = '#fff'; }}
                    onMouseLeave={e => { e.currentTarget.style.background = T.surface2; e.currentTarget.style.color = T.text3; }}>
                    {s.svg}
                  </a>
                ))}
              </div>
              <a href="https://the99coinproject.org" target="_blank" rel="noopener noreferrer"
                aria-label="T99CP Wallet — ouvre dans un nouvel onglet"
                style={{ color: T.info, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 13, textDecoration: 'none' }}>
                ₮ T99CP Wallet ↗
              </a>
            </div>

            {/* Légal */}
            <div>
              <h4 style={{ fontFamily: "'Sora',sans-serif", fontSize: 12, fontWeight: 700, color: T.text2, textTransform: 'uppercase', letterSpacing: '0.08em', margin: '0 0 14px' }}>Légal</h4>
              <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: 9 }}>
                {[['Mentions légales', 'legal'], ['CGU', 'cgu'], ['Confidentialité (RGPD)', 'rgpd'], ['Contact', 'contact']].map(([l, p]) => (
                  <li key={p}>
                    <a href={`#${p}`} onClick={e => { e.preventDefault(); setPage(p); }} style={{ cursor: 'pointer', transition: 'color 0.15s', textDecoration: 'none', color: T.text3, fontSize: 13 }}
                      onMouseEnter={e => e.currentTarget.style.color = T.brand} onMouseLeave={e => e.currentTarget.style.color = T.text3}>{l}</a>
                  </li>
                ))}
              </ul>
            </div>
          </div>

          {/* Bottom strip : visible partout (incl. mobile) */}
          <div className="mn-footer-strip" style={{ borderTop: `1px solid ${T.border}`, padding: '14px 24px', maxWidth: 1280, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12, fontSize: 12, color: T.text4 }}>
            <span>© 2026 Maintenant ! — La voix des 99%</span>
            <div style={{ display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap' }}>
              <a href="#legal" onClick={e => { e.preventDefault(); setPage('legal'); }} style={{ color: T.text3, textDecoration: 'none' }}
                onMouseEnter={e => e.currentTarget.style.color = T.brand} onMouseLeave={e => e.currentTarget.style.color = T.text3}>Mentions légales</a>
              <a href="https://the99coinproject.org" target="_blank" rel="noopener noreferrer"
                aria-label="T99CP Wallet — ouvre dans un nouvel onglet"
                style={{ color: T.info, fontWeight: 600, textDecoration: 'none' }}>
                ₮ T99CP ↗
              </a>
            </div>
          </div>
        </footer>
      )}

      {/* Mobile bottom nav */}
      {!noNav && <BottomNav page={page} setPage={setPage} user={user} />}

      {/* Auth modal */}
      <AuthModal open={authOpen} onClose={() => setAuthOpen(false)} onLogin={handleLogin} />

      {/* ── Tweaks Panel ────────────────────────────────── */}
      <div id="tweaks-panel" className={tweakOpen ? 'open' : ''}>
        <div className="tw-head">
          ⚙ Tweaks
          <button onClick={() => { setTweakOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); }}
            style={{ border: 'none', background: T.surface2, borderRadius: '50%', width: 24, height: 24, cursor: 'pointer', fontSize: 14, color: T.text3, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>×</button>
        </div>

        <div>
          <div className="tw-label">Page de démarrage</div>
          <div className="tw-row">
            {['home','join','communes','petitions','housing','marketplace','sel','carpooling','garden','lending','media','polls','campaigns','reseau','admin','profile'].map(p => (
              <button key={p} className={`tw-btn${page === p ? ' active' : ''}`}
                onClick={() => { setPage(p); const n = { ...tweak, startPage: p }; setTweak(n); window.parent.postMessage({ type: '__edit_mode_set_keys', edits: n }, '*'); }}>{p}</button>
            ))}
          </div>
        </div>

        <div>
          <div className="tw-label">Mode admin</div>
          <div className="tw-row">
            <button className={`tw-btn${adminMode ? ' active' : ''}`}
              onClick={() => { const v = !adminMode; setAdminMode(v); const n = { ...tweak, adminMode: v }; setTweak(n); window.parent.postMessage({ type: '__edit_mode_set_keys', edits: n }, '*'); }}>
              {adminMode ? '✓ Activé' : 'Désactivé'}
            </button>
          </div>
        </div>

        <div>
          <div className="tw-label">Utilisateur simulé</div>
          <div className="tw-row">
            <button className={`tw-btn${!user ? ' active' : ''}`} onClick={() => setUser(null)}>Déconnecté</button>
            <button className={`tw-btn${user && !user.is_admin && !user.is_member ? ' active' : ''}`}
              onClick={() => setUser({ name: 'Marie Dupont', email: 'marie@maintenant.org', t99cp_balance: 247, is_admin: false, is_member: false, badges: ['Militante active'], joined: '2025-06-12', location: 'Paris', bio: 'Militante écologiste et féministe engagée depuis 10 ans.' })}>
              Connecté
            </button>
            <button className={`tw-btn${user?.is_member && !user?.is_admin ? ' active' : ''}`}
              onClick={() => setUser({ name: 'Marie Dupont', email: 'marie@maintenant.org', t99cp_balance: 247, is_admin: false, is_member: true, member_tier: 'gratuit', member_since: new Date().toISOString(), badges: ['Adhérent·e', 'Militante active'], joined: '2025-06-12', location: 'Paris', bio: 'Militante écologiste et féministe engagée depuis 10 ans.' })}>
              Adhérent·e
            </button>
            <button className={`tw-btn${user?.is_admin ? ' active' : ''}`}
              onClick={() => { setUser({ name: 'Admin', email: 'admin@maintenant.org', t99cp_balance: 500, is_admin: true, is_member: true, member_tier: 'admin', member_since: new Date().toISOString(), badges: ['Admin', 'Fondateur'], joined: '2025-01-01', location: 'France' }); setAdminMode(true); }}>
              Admin
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider><App /></ToastProvider>
);
</script>
</body>
</html>
