<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #F9FAFB; padding: 20px; display: flex; gap: 14px; align-items: flex-start; }
.card { background: #fff; border-radius: 16px; border: 1px solid #E5E7EB; overflow: hidden; width: 200px; transition: box-shadow 0.2s, transform 0.2s; }
.card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.10); transform: translateY(-2px); }
.card-img { height: 80px; background: linear-gradient(135deg, #C1121F 0%, #F4721E 100%); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.4); font-size: 10px; }
.card-body { padding: 12px; }
.card-cat { font-size: 10px; font-weight: 600; color: #C1121F; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.card-title { font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; color: #111827; line-height: 1.3; margin-bottom: 6px; }
.card-meta { font-size: 11px; color: #6B7280; }
.progress-wrap { margin-top: 8px; }
.progress-bar { height: 4px; background: #F3F4F6; border-radius: 9999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(to right, #C1121F, #F4721E); border-radius: 9999px; }
.progress-label { display: flex; justify-content: space-between; font-size: 10px; color: #9CA3AF; margin-top: 3px; }
.stat-card { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 14px; text-align: center; width: 90px; }
.hero-wrap { background: linear-gradient(135deg, #C1121F, #F4721E); padding: 14px; border-radius: 12px; display: flex; gap: 8px; }
</style>
</head><body>
<!-- Petition card -->
<div class="card">
  <div class="card-img">Image pétition</div>
  <div class="card-body">
    <div class="card-cat">Environnement</div>
    <div class="card-title">Pour une transition écologique immédiate</div>
    <div class="card-meta">2 847 signatures</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:71%"></div></div>
      <div class="progress-label"><span>71%</span><span>4 000 objectif</span></div>
    </div>
  </div>
</div>

<!-- Crowdfunding card -->
<div class="card">
  <div class="card-img" style="background:linear-gradient(135deg,#1F2937,#374151)">Image cagnotte</div>
  <div class="card-body">
    <div class="card-cat" style="color:#F4721E">Cagnotte solidaire</div>
    <div class="card-title">Caisse de grève — Transport</div>
    <div class="card-meta" style="color:#374151;font-weight:600">1 240 € / 5 000 €</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:25%"></div></div>
      <div class="progress-label"><span>25%</span><span>12 j restants</span></div>
    </div>
  </div>
</div>

<!-- Stat card (hero context) -->
<div class="hero-wrap">
  <div class="stat-card">
    <div style="font-size:20px;font-weight:800;color:#fff;font-family:'Sora',sans-serif">946</div>
    <div style="font-size:10px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px">Membres</div>
  </div>
  <div class="stat-card">
    <div style="font-size:20px;font-weight:800;color:#fff;font-family:'Sora',sans-serif">10k+</div>
    <div style="font-size:10px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px">Abonnés</div>
  </div>
</div>
</body></html>
