<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #F9FAFB; padding: 16px; }
.phone-bar { max-width: 375px; background: #fff; border-top: 1px solid #E5E7EB; padding: 8px 8px 12px; border-radius: 0 0 16px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-around; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 10px; border-radius: 12px; cursor: pointer; flex: 1; position: relative; }
.tab-icon { font-size: 20px; line-height: 1; }
.tab-label { font-size: 10px; font-weight: 600; color: #6B7280; }
.tab.active .tab-label { color: #C1121F; }
.tab.active .tab-icon { transform: scale(1.1); }
.active-bar { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; background: linear-gradient(to right, #C1121F, #F4721E); border-radius: 9999px; }
.fab { position: relative; top: -14px; flex: 1; display: flex; justify-content: center; }
.fab-btn { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #C1121F, #F4721E); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; box-shadow: 0 8px 20px rgba(193,18,31,0.40); border: 3px solid #F9FAFB; }
</style>
</head><body>
<div class="phone-bar">
  <div class="tab active">
    <div class="active-bar"></div>
    <div class="tab-icon">🏠</div>
    <div class="tab-label" style="color:#C1121F">Accueil</div>
  </div>
  <div class="tab">
    <div class="tab-icon">⚙️</div>
    <div class="tab-label">Services</div>
  </div>
  <div class="fab">
    <div class="fab-btn">+</div>
  </div>
  <div class="tab">
    <div class="tab-icon">👤</div>
    <div class="tab-label">Profil</div>
  </div>
  <div class="tab">
    <div class="tab-icon">🔔</div>
    <div class="tab-label">Notifs</div>
  </div>
</div>
</body></html>
