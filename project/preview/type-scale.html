<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sora', sans-serif; background: #fff; padding: 20px 24px; }
.row { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid #F3F4F6; padding: 8px 0; }
.tag { font-size: 10px; font-weight: 600; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.08em; width: 44px; flex-shrink: 0; font-family: 'Inter', sans-serif; padding-top: 2px; }
.sample { color: #111827; letter-spacing: -0.02em; font-weight: 800; line-height: 1.1; }
.sub { font-size: 10px; color: #9CA3AF; font-family: 'Inter', sans-serif; }
</style>
</head><body>
<div class="row"><span class="tag">7xl</span><span class="sample" style="font-size:42px">Maintenant !</span></div>
<div class="row"><span class="tag">5xl</span><span class="sample" style="font-size:30px">La voix des 99%</span></div>
<div class="row"><span class="tag">4xl</span><span class="sample" style="font-size:24px">Mobilisation citoyenne</span></div>
<div class="row"><span class="tag">3xl</span><span class="sample" style="font-size:20px">Pétitions en vedette</span></div>
<div class="row"><span class="tag">2xl</span><span class="sample" style="font-size:17px; font-weight:700">Toutes les pétitions</span></div>
<div class="row"><span class="tag">xl</span><span class="sample" style="font-size:15px; font-weight:600">Cagnottes solidaires</span></div>
<div style="margin-top:8px; font-size:10px; color:#9CA3AF; font-family:Inter,sans-serif">Sora · weights 700/800 · tracking -0.02em</div>
</body></html>
