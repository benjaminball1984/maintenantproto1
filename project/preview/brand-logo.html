<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #F9FAFB; padding: 20px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.splash { width: 160px; height: 160px; background: linear-gradient(135deg, #C1121F 0%, #e85d04 100%); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 30px rgba(193,18,31,0.35); }
.splash img { width: 72px; height: 72px; border-radius: 14px; object-fit: contain; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.splash-label { color: rgba(255,255,255,0.9); font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; }
.wordmark { display: flex; flex-direction: column; gap: 4px; }
.wm-main { font-family: 'Sora', sans-serif; font-size: 32px; font-weight: 800; color: #C1121F; letter-spacing: -0.02em; line-height: 1; }
.wm-sub { font-size: 12px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: 0.1em; }
.tag-line { background: linear-gradient(135deg, #C1121F, #F4721E); border-radius: 12px; padding: 12px 16px; max-width: 220px; }
.tag-line p { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; color: #fff; line-height: 1.4; }
.tag-line span { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 400; }
</style>
</head><body>
<div class="splash">
  <img src="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/69875f581fc4bdc871bc013d/58e1cd879_MAINTENANT1.jpg" alt="logo" onerror="this.style.display='none'">
  <div class="splash-label">THE99COINPROJECT</div>
</div>
<div style="display:flex;flex-direction:column;gap:16px;justify-content:center">
  <div class="wordmark">
    <div class="wm-main">Maintenant !</div>
    <div class="wm-sub">La voix des 99%</div>
  </div>
  <div class="tag-line">
    <p>Face aux oppressions systémiques,<br>nos luttes doivent devenir systémiques.</p>
    <span>— THE99COINPROJECT</span>
  </div>
</div>
</body></html>
